[metadata]
name = depbench-release
version = 0.1.0
description = DepBench contract-clean release helpers
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE.txt

[options]
packages = find:
python_requires = >=3.12
install_requires =
    harbor>=0.15.0
    huggingface-hub>=0.28.0

[options.packages.find]
include =
    custom_agents*
