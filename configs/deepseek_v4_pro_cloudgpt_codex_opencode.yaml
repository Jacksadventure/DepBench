# Run with:
#   scripts/with_cloudgpt_token.sh -- uv run harbor run -c configs/deepseek_v4_pro_cloudgpt_codex_opencode.yaml -y
jobs_dir: harbor_jobs
n_attempts: 1
timeout_multiplier: 1.0
debug: false
n_concurrent_trials: 1
quiet: false
retry:
  max_retries: 0
  exclude_exceptions:
    - VerifierTimeoutError
    - AgentTimeoutError
    - RewardFileEmptyError
    - RewardFileNotFoundError
    - VerifierOutputParseError
environment:
  type: docker
  force_build: false
  delete: true
  override_memory_mb: 8192
  env: {}
  kwargs: {}
verifier:
  env: {}
  disable: false
artifacts: []
metrics: []
datasets:
  - path: harbor_benchmark/tasks_v4
    task_names:
      - actix__actix__554
agents:
  - import_path: custom_agents.codex:CustomCodex
    model_name: DeepSeek-V4-Pro
    kwargs:
      version: "0.130.0"
      reasoning_effort: high
      provider_name: cloudgpt
      base_url: https://cloudgpt-openai.azure-api.net/openai/v1
      wire_api: responses
      requires_openai_auth: true
      settings_path: /tmp/depbench-no-claude-settings.json
    env: {}
  - import_path: custom_agents.opencode:CustomOpenCode
    model_name: DeepSeek-V4-Pro
    kwargs:
      default_provider: cloudgpt
      base_url: https://cloudgpt-openai.azure-api.net/openai/v1
      disable_web_tools: true
      settings_path: /tmp/depbench-no-claude-settings.json
    env: {}
