jobs_dir: harbor_jobs
n_attempts: 1
timeout_multiplier: 1.0
debug: false
n_concurrent_trials: 1
quiet: false
retry:
  max_retries: 0
  exclude_exceptions:
    - VerifierTimeoutError
    - AgentTimeoutError
    - RewardFileEmptyError
    - RewardFileNotFoundError
    - VerifierOutputParseError
environment:
  type: docker
  force_build: false
  delete: true
  override_memory_mb: 8192
  env: {}
  kwargs: {}
verifier:
  env: {}
  disable: false
artifacts: []
metrics: []
datasets:
  - path: harbor_benchmark/tasks_v4
    task_names:
      - actix__actix__554
agents:
  - import_path: custom_agents.codex:CustomCodex
    model_name: gpt-5.3-codex
    kwargs:
      version: "0.130.0"
      reasoning_effort: high
      provider_name: depbench-openai
      wire_api: responses
      requires_openai_auth: false
      settings_path: ~/.claude/settings.json
    env: {}
  - import_path: custom_agents.claude_code:CustomClaudeCode
    model_name: claude-opus-4-8
    kwargs:
      base_url: http://172.100.216.1:23333/api/anthropic
      auth_token: dummy
      settings_path: ~/.claude/settings.json
    env: {}
  - import_path: custom_agents.opencode:CustomOpenCode
    model_name: gpt-5.3-codex
    kwargs:
      settings_path: ~/.claude/settings.json
      disable_web_tools: true
    env: {}
  - import_path: custom_agents.copilot_cli:CustomCopilotCli
    model_name: auto
    kwargs:
      version: "1.0.63"
      disable_web_tools: true
    env: {}
