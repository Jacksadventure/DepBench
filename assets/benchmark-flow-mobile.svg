<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 860" role="img" aria-labelledby="title desc">
  <title id="title">DepBench benchmark flow</title>
  <desc id="desc">Repository state flows through dependency upgrade, agent repair, hidden verification, and pass or non-pass scoring.</desc>
  <style>
    .step { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 21px; font-weight: 650; letter-spacing: 0; fill: #172033; }
    .arrow { fill: none; stroke: #667085; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="8" y="8" width="544" height="844" rx="8" fill="#F8FAFC" stroke="#D8E0EA"/>

  <path class="arrow" d="M280 166v18m-7-7 7 7 7-7"/>
  <path class="arrow" d="M280 328v18m-7-7 7 7 7-7"/>
  <path class="arrow" d="M280 490v18m-7-7 7 7 7-7"/>
  <path class="arrow" d="M280 652v18m-7-7 7 7 7-7"/>

  <g>
    <rect x="40" y="32" width="480" height="126" rx="8" fill="#FFFFFF" stroke="#CDD5E1"/>
    <rect x="40" y="32" width="7" height="126" rx="3" fill="#172033"/>
    <circle cx="76" cy="64" r="18" fill="#172033"/>
    <text class="step" x="76" y="69" text-anchor="middle" fill="#FFFFFF">01</text>
    <path d="M456 54h28M456 64h28M456 74h19" fill="none" stroke="#8390A5" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="64" y="121">Repository state</text>
  </g>

  <g>
    <rect x="40" y="194" width="480" height="126" rx="8" fill="#FFFFFF" stroke="#E2BD58"/>
    <rect x="40" y="194" width="7" height="126" rx="3" fill="#F6C85F"/>
    <circle cx="76" cy="226" r="18" fill="#F6C85F"/>
    <text class="step" x="76" y="231" text-anchor="middle" fill="#172033">02</text>
    <path d="M470 239v-24m0 0-10 10m10-10 10 10" fill="none" stroke="#A47A0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="64" y="274">
      <tspan x="64">Dependency manifest</tspan>
      <tspan x="64" dy="28">upgrade</tspan>
    </text>
  </g>

  <g>
    <rect x="40" y="356" width="480" height="126" rx="8" fill="#FFFFFF" stroke="#E86155"/>
    <rect x="40" y="356" width="7" height="126" rx="3" fill="#FF6B5E"/>
    <circle cx="76" cy="388" r="18" fill="#FF6B5E"/>
    <text class="step" x="76" y="393" text-anchor="middle" fill="#172033">03</text>
    <path d="m457 377-10 10 10 10m17-20 10 10-10 10" fill="none" stroke="#B93F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="64" y="436">
      <tspan x="64">Agent-authored repository</tspan>
      <tspan x="64" dy="28">repair</tspan>
    </text>
  </g>

  <g>
    <rect x="40" y="518" width="480" height="126" rx="8" fill="#FFFFFF" stroke="#8390A5" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="40" y="518" width="7" height="126" rx="3" fill="#8390A5"/>
    <circle cx="76" cy="550" r="18" fill="#8390A5"/>
    <text class="step" x="76" y="555" text-anchor="middle" fill="#FFFFFF">04</text>
    <path d="M470 538a10 10 0 0 0-10 10v5h20v-5a10 10 0 0 0-10-10Zm-13 15h26v15h-26z" fill="none" stroke="#667085" stroke-width="3" stroke-linejoin="round"/>
    <text class="label" x="64" y="598">
      <tspan x="64">Hidden test patch +</tspan>
      <tspan x="64" dy="28">verifier</tspan>
    </text>
  </g>

  <g>
    <rect x="40" y="680" width="480" height="126" rx="8" fill="#FFFFFF" stroke="#1CB7AA"/>
    <rect x="40" y="680" width="7" height="126" rx="3" fill="#36CFC0"/>
    <circle cx="76" cy="712" r="18" fill="#36CFC0"/>
    <text class="step" x="76" y="717" text-anchor="middle" fill="#172033">05</text>
    <path d="m447 709 8 8 16-18" fill="none" stroke="#119E93" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m484 703 15 15m0-15-15 15" fill="none" stroke="#FF6B5E" stroke-width="3.5" stroke-linecap="round"/>
    <text class="label" x="64" y="769">Pass / non-pass outcome</text>
  </g>
</svg>
