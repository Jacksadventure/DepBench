<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 256" role="img" aria-labelledby="title desc">
  <title id="title">DepBench benchmark flow</title>
  <desc id="desc">Repository state flows through dependency upgrade, agent repair, hidden verification, and pass or non-pass scoring.</desc>
  <defs>
    <style>
      .step { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 650; letter-spacing: 0; fill: #172033; }
      .arrow { fill: none; stroke: #667085; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="8" y="8" width="1104" height="240" rx="8" fill="#F8FAFC" stroke="#D8E0EA"/>

  <path class="arrow" d="M217 128h18m-7-7 7 7-7 7"/>
  <path class="arrow" d="M435 128h18m-7-7 7 7-7 7"/>
  <path class="arrow" d="M653 128h18m-7-7 7 7-7 7"/>
  <path class="arrow" d="M871 128h18m-7-7 7 7-7 7"/>

  <g>
    <rect x="24" y="48" width="188" height="160" rx="8" fill="#FFFFFF" stroke="#CDD5E1"/>
    <rect x="24" y="48" width="6" height="160" rx="3" fill="#172033"/>
    <circle cx="58" cy="80" r="18" fill="#172033"/>
    <text class="step" x="58" y="85" text-anchor="middle" fill="#FFFFFF">01</text>
    <path d="M157 72h25M157 80h25M157 88h17" fill="none" stroke="#8390A5" stroke-width="3" stroke-linecap="round"/>
    <text class="label" x="48" y="137">
      <tspan x="48">Repository</tspan>
      <tspan x="48" dy="27">state</tspan>
    </text>
  </g>

  <g>
    <rect x="242" y="48" width="188" height="160" rx="8" fill="#FFFFFF" stroke="#E2BD58"/>
    <rect x="242" y="48" width="6" height="160" rx="3" fill="#F6C85F"/>
    <circle cx="276" cy="80" r="18" fill="#F6C85F"/>
    <text class="step" x="276" y="85" text-anchor="middle" fill="#172033">02</text>
    <path d="M363 91V69m0 0-9 9m9-9 9 9" fill="none" stroke="#A47A0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="266" y="125">
      <tspan x="266">Dependency</tspan>
      <tspan x="266" dy="27">manifest</tspan>
      <tspan x="266" dy="27">upgrade</tspan>
    </text>
  </g>

  <g>
    <rect x="460" y="48" width="188" height="160" rx="8" fill="#FFFFFF" stroke="#E86155"/>
    <rect x="460" y="48" width="6" height="160" rx="3" fill="#FF6B5E"/>
    <circle cx="494" cy="80" r="18" fill="#FF6B5E"/>
    <text class="step" x="494" y="85" text-anchor="middle" fill="#172033">03</text>
    <path d="m575 70-8 8 8 8m13-16 8 8-8 8" fill="none" stroke="#B93F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="484" y="125">
      <tspan x="484">Agent-authored</tspan>
      <tspan x="484" dy="27">repository</tspan>
      <tspan x="484" dy="27">repair</tspan>
    </text>
  </g>

  <g>
    <rect x="678" y="48" width="188" height="160" rx="8" fill="#FFFFFF" stroke="#8390A5" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="678" y="48" width="6" height="160" rx="3" fill="#8390A5"/>
    <circle cx="712" cy="80" r="18" fill="#8390A5"/>
    <text class="step" x="712" y="85" text-anchor="middle" fill="#FFFFFF">04</text>
    <path d="M795 68a10 10 0 0 0-10 10v5h20v-5a10 10 0 0 0-10-10Zm-13 15h26v15h-26z" fill="none" stroke="#667085" stroke-width="3" stroke-linejoin="round"/>
    <text class="label" x="702" y="125">
      <tspan x="702">Hidden test</tspan>
      <tspan x="702" dy="27">patch +</tspan>
      <tspan x="702" dy="27">verifier</tspan>
    </text>
  </g>

  <g>
    <rect x="896" y="48" width="200" height="160" rx="8" fill="#FFFFFF" stroke="#1CB7AA"/>
    <rect x="896" y="48" width="6" height="160" rx="3" fill="#36CFC0"/>
    <circle cx="930" cy="80" r="18" fill="#36CFC0"/>
    <text class="step" x="930" y="85" text-anchor="middle" fill="#172033">05</text>
    <path d="m1014 78 7 7 14-16" fill="none" stroke="#119E93" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m1050 72 13 13m0-13-13 13" fill="none" stroke="#FF6B5E" stroke-width="3.5" stroke-linecap="round"/>
    <text class="label" x="920" y="125">
      <tspan x="920">Pass /</tspan>
      <tspan x="920" dy="27">non-pass</tspan>
      <tspan x="920" dy="27">outcome</tspan>
    </text>
  </g>
</svg>
