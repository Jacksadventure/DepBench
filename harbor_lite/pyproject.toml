[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-lite"
version = "0.1.0"
description = "Lightweight local runner for coding-agent CLIs with Harbor-compatible artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Git2Harness contributors" },
]
keywords = ["agents", "harbor", "codex", "gemini", "qwen", "claude"]
dependencies = []

[project.optional-dependencies]
harbor = ["harbor>=0.4.0"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["harbor_lite", "harbor_lite.agents"]
include-package-data = true

[tool.setuptools.package-dir]
harbor_lite = "."
