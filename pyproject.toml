[project]
name = "depbench-release"
version = "0.1.0"
description = "DepBench contract-clean release helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "harbor>=0.15.0",
    "huggingface-hub>=0.28.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_agents*"]
